# 󰤇  
#        󰍟             󰁕 󰁖 󰁗 󰁘 󰁚 󰄾 󰅂 󰍟 󰓺 󰔰 󰘠 󰛂 󰛂 󰛂 󰜴 󰜵 󰞘 󰦥 󰧂 󰧚 󰧛 󰬪 󰬪 󰮺 󰳟 󰶻 󰷵 󱦰 
# bright-black, bright-red, bright-green, bright-blue, bright-yellow, bright-purple, bright-cyan, bright-white
#${custom.elixir}\
#${custom.nu_jobs}\

format = """
[╭─󰧂 ](fg:#DA627D)\
$directory\
$git_branch\
$git_status\
$elixir\
$golang\
$bun\
$rust\
$fill \
$aws\
$gcloud\
$username\
$hostname\
$os \
$memory_usage\
$cmd_duration\
$line_break\
[╰─](fg:#DA627D)\
$shell\
$character"""

# $nim\
# $rust\
# $fill \
# $aws \
# $gcloud \
# $memory_usage\
# $username\
# $hostname\
# $os \

command_timeout = 300
add_newline = false

[character]
success_symbol = "[](bold fg:cyan)"
error_symbol = "[](bold fg:red)"

[shell]
style = "fg:#DA627D"
format = "[$indicator ]($style)"
disabled = false
fish_indicator = "󰈺"
nu_indicator = ""
zsh_indicator = "󰰸"
bash_indicator = ""

[fill]
disabled = false
symbol = " "
style = "fg:bright-white"

[ jobs ]
style = "fg:yellow"
symbol = "󰑮 "
format = "[$symbol$number]($style) "

[ custom.nu_jobs ]
command = "job list | length"
use_stdin = false
style = "fg:yellow"
symbol = "󰑮 "
format = "[$symbol$output]($style) "

[ cmd_duration ]
min_time = 0
format = "[󱎫 $duration]($style) "

[ username ]
show_always = true
style_user = "fg:purple"
style_root = "fg:purple"
format = "[$user󰓺 ]($style) "
disabled = false

[ aws ]
disabled = true
# format="[$symbol$profile 󰍎$region]($style)"
format="[$symbol$profile]($style)"
symbol = " "

[ hostname ]
ssh_symbol = "SSH"
ssh_only = false
style = "fg:green"
format = "[󰒍 $ssh_symbol$hostname ]($style)"
disabled = false

[gcloud]
disabled = false
format = '[$symbol$account(@$domain::$project)(\($region\))]($style) '
# symbol = '🇬️ '
symbol = '󱇶 '

[aws.region_aliases]
us-west-2= "pdx"
us-east-1= "iad"
eu-west-1= "dub"
eu-central-1= "fra"
ca-central-1= "iad"

[ directory ]
format = "[$path ]($style) "
truncation_length = 2
truncation_symbol = "… /"
truncate_to_repo = false

[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[docker_context]
symbol = " "
style = ""
format = "[$symbol $context ]($style) $path"

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#33658A"
format = "[[♥ $time ](bg:#33658A)]($style)"

[git_branch]
format = '[$symbol$branch ]($style)'
truncation_length = 25
symbol = " "

[git_status]
format = "[($all_status$ahead_behind) ]($style)"
ahead = "⇡$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
behind = "⇣$count"


[ memory_usage ]
symbol = "󰤇 "
threshold = 0
disabled = false
format = "$symbol[$ram_pct]($style) "

[ os ]
disabled = false
style = "fg:green"

[os.symbols]
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
# CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
# Nobara = " "
OpenBSD = "󰈺 "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
RedHatEnterprise = " "
Redhat = " "
Redox = "󰀘 "
RockyLinux = " "
SUSE = " "
Solus = "󰠳 "
Ubuntu = " "
Unknown = " "
