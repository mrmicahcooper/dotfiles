Windows = "󰍲 "
openSUSE = " "


[ golang ]
symbol = " "

[ haskell ]
symbol = " "

[ hg_branch ]
symbol = " "

[ java ]
symbol = " "

[ julia ]
symbol = " "

[ lua ]
symbol = " "

[ elixir ]
symbol = " "

[ nix_shell ]
symbol = " "

[ nodejs ]
symbol = " "

[ python ]
symbol = " "

[ ruby ]
symbol = " "

[ rust ]
symbol = " "

