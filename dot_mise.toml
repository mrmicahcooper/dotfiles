[settings]
experimental = true
# lockfile = true

[env]
_.file= "~/.secrets.env"
NUM_CPUS = "{{ (num_cpus() | int / 2) | int }}"
MIX_OS_DEPS_COMPILE_PARTITION_COUNT = "{{ (num_cpus() | int / 2) | int }}"
ERL_AFLAGS="-kernel shell_history enabled"
ZELLIJ_AUTO_ATTACH = "true"
ZELLIJ_AUTO_EXIT = "true"

[tools]
# Languages
elixir = "latest"
erlang = "latest"
nodejs = "latest"
deno = "latest"
python = "latest"
rust = "latest"
zig = "latest"

# CLIs
"aqua:cli/cli" = "latest"
"npm:skills" = "latest"
1password = "latest"
chezmoi = "latest"
fnox = "latest"
fzf = "latest"
kubectl = "latest"
kubectx = "latest"
neovim = "latest"
podman = "latest"
ripgrep = "latest"
flyctl = "latest"
"npm:chalk-cli" = "latest"

# TUIs
"claude-code" = "latest"
ollama = "latest"
claude = "latest"
k9s = "latest"
herdr = "latest"

# Other
starship = "latest"
sqlite = "latest"

